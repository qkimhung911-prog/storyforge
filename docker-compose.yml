services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: storyforge-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
    volumes:
      - n8n_data:/home/node/.n8n

  render:
    build: ./render
    container_name: storyforge-render
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./output:/output

  web:
    image: nginx:alpine
    container_name: storyforge-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./output:/srv/output:ro
      - ./docs:/srv/docs:ro

volumes:
  n8n_data: