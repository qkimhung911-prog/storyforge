<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible | StoryForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23111'/%3E%3Cpath d='M9.5 7.5v9l7-4.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
  .asset .thumb.photo { padding: 0; height: 230px; overflow: hidden; background: #E9E4DD; }
  .asset .thumb.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  .asset-actions { padding: 2px 6px 6px; }
  .btn.sm { min-height: 36px; padding: 0 16px; font-size: 11px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.busy { cursor: wait; opacity: 1; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .toolbar h2 { margin: 0 !important; }
  .notice { margin-bottom: 20px; padding: 14px 16px; border-radius: 14px; font-size: 14px; }
  .notice.ok { background: #1E9E631F; color: var(--green); }
  .notice.err { background: #D92D201A; color: #B3261E; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .props { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
  .prop-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prop-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: #F3EEE8; }
  .prop-thumb.empty { display: inline-block; border-style: dashed; }
</style>
</head>
<body>
<div class="shell">
  <header class="hero app-hero" id="hero"></header>
  <main class="content" id="content" aria-live="polite"><div class="card note-box">Đang tải…</div></main>
  <footer class="mono" style="font-size:11px;text-align:center;padding:36px 0 40px;color:var(--muted)">StoryForge · dự án portfolio</footer>
</div>
<script src="config.js"></script>
<script src="app.js?v=5"></script>
<script>
const TILES = ['linear-gradient(160deg,#F08A3C,#E0457B)', 'linear-gradient(160deg,#E0457B,#9B5CF6)', 'linear-gradient(160deg,#9B5CF6,#4A5FD6)', 'linear-gradient(160deg,#F5948C,#B25FD0)'];

SF.boot({
  active: 'bible', step: 2, pageTitle: 'Bible',
  title: 'Khóa nhân vật và <span class="grad-text">bối cảnh</span>',
  sub: 'Mọi shot sau này chỉ được dùng những asset đã khóa ở bước này.',
}, async (project, root) => {
  // Chân dung nằm trong output/<project>/images/char-<slug>.jpg: nếu file có (kể cả ảnh tải lên) thì hiện,
  // kèm ngày sửa file để trình duyệt không giữ ảnh cũ.
  const loadChars = async () => {
    const list = await SF.query(`characters?project_id=eq.${project.id}&select=*&order=name`);
    await Promise.all(list.map(async (c) => {
      try {
        const url = `output/${project.id}/images/char-${c.slug}.jpg`;
        const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        if (r.ok) c.portrait_url = `${url}?v=${Date.parse(r.headers.get('last-modified') || '') || 1}`;
      } catch { /* giữ giá trị trong cơ sở dữ liệu */ }
      // Ảnh phụ kiện: output/<project>/props/<slug>-<số thứ tự>.jpg
      c._props = {};
      await Promise.all((c.accessories || []).map(async (_, k) => {
        try {
          const url = `output/${project.id}/props/${c.slug}-${k + 1}.jpg`;
          const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
          if (r.ok) c._props[k] = `${url}?v=${Date.parse(r.headers.get('last-modified') || '') || 1}`;
        } catch { /* chưa có ảnh */ }
      }));
    }));
    return list;
  };
  let chars = await loadChars();
  const locs = await SF.query(`locations?project_id=eq.${project.id}&select=*&order=name`);
  const e = SF.esc;
  const busy = new Set(); // 'all' hoặc slug nhân vật đang tạo chân dung
  let notice = null;
  const spin = '<span class="spin" aria-hidden="true"></span>';

  const charCard = (c, i) => `
    <article class="card asset">
      ${c.portrait_url
        ? `<div class="thumb photo"><img src="${e(c.portrait_url)}" alt="Chân dung ${e(c.name)}" loading="lazy"></div>`
        : `<div class="thumb" style="background:${TILES[i % TILES.length]}" aria-hidden="true">${e(c.name.charAt(0))}</div>`}
      <div class="body">
        <h3>${e(c.name)}</h3>
        <div class="meta">${e([c.gender, c.age ? c.age + ' tuổi' : ''].filter(Boolean).join(' · '))}</div>
        ${c.appearance ? `<p><b>Ngoại hình:</b> ${e(c.appearance)}</p>` : ''}
        ${c.outfit ? `<p><b>Trang phục:</b> ${e(c.outfit)}</p>` : ''}
        ${(c.accessories || []).length ? `<div class="props">${c.accessories.map((a, k) => `
          <div class="prop-row">
            ${c._props[k] ? `<img class="prop-thumb" src="${e(c._props[k])}" alt="Ảnh phụ kiện ${e(a)}" loading="lazy">` : '<span class="prop-thumb empty" aria-hidden="true"></span>'}
            <span class="chip">${e(a)}</span>
            <label class="btn sm ${busy.has(`pr-${c.slug}-${k}`) ? 'busy' : ''}" style="cursor:pointer" title="Tải ảnh chụp cận phụ kiện này để khóa hình dạng giữa các shot">
              ${busy.has(`pr-${c.slug}-${k}`) ? spin + 'Đang tải' : (c._props[k] ? 'Đổi ảnh' : 'Tải ảnh phụ kiện')}
              <input type="file" accept="image/jpeg,image/png,image/webp" data-prop="${e(c.slug)}|${k + 1}" hidden ${busy.size ? 'disabled' : ''}>
            </label>
          </div>`).join('')}</div>` : ''}
        ${c.voice ? `<p class="meta">Giọng: ${e(c.voice)}</p>` : ''}
      </div>
      <div class="asset-actions">
        <label class="btn btn-dark no-arrow sm ${busy.has('up-' + c.slug) ? 'busy' : ''}" style="cursor:pointer" title="Tải ảnh chân dung bạn tự tạo (ví dụ bằng Google Flow) lên thay chân dung này">
          ${busy.has('up-' + c.slug) ? spin + 'Đang tải' : 'Tải ảnh lên'}
          <input type="file" accept="image/jpeg,image/png,image/webp" data-upload="${e(c.slug)}" hidden ${busy.size ? 'disabled' : ''}>
        </label>
        <button class="btn sm ${busy.has(c.slug) ? 'busy' : ''}" type="button" data-portrait="${e(c.slug)}" aria-label="${c.portrait_url ? 'Tạo lại' : 'Tạo'} chân dung ${e(c.name)}" ${busy.size ? 'disabled' : ''}>${busy.has(c.slug) ? spin + 'Đang tạo' : (c.portrait_url ? 'Tạo lại chân dung' : 'Tạo chân dung')}</button>
      </div>
    </article>`;

  const locCard = (l, i) => `
    <article class="card asset">
      <div class="thumb" style="background:${TILES[(i + 2) % TILES.length]}" aria-hidden="true">${e(l.name.charAt(0))}</div>
      <div class="body">
        <h3>${e(l.name)}</h3>
        ${l.description ? `<p>${e(l.description)}</p>` : ''}
        ${l.lighting ? `<p class="meta">Ánh sáng: ${e(l.lighting)}</p>` : ''}
      </div>
    </article>`;

  function draw() {
    const withPortrait = chars.filter((c) => c.portrait_url).length;
    root.innerHTML = `
      <div class="summary">
        <span class="chip">Dự án: <b>${e(project.title)}</b></span>
        <span class="chip">${chars.length} nhân vật</span>
        <span class="chip">${withPortrait}/${chars.length} có chân dung</span>
        <span class="chip">${locs.length} bối cảnh</span>
      </div>
      ${notice ? `<div class="notice ${notice.ok ? 'ok' : 'err'}" role="status">${e(notice.text)}</div>` : ''}
      <section class="group">
        <div class="toolbar">
          <h2 class="mono">• Nhân vật</h2>
          <button class="btn btn-dark no-arrow sm ${busy.has('all') ? 'busy' : ''}" type="button" data-portrait="all" ${busy.size ? 'disabled' : ''}>${busy.has('all') ? spin + 'Đang tạo chân dung (khoảng 30 giây)' : 'Tạo chân dung cho tất cả'}</button>
        </div>
        <div class="grid">${chars.map(charCard).join('') || '<div class="card note-box">Chưa có nhân vật.</div>'}</div>
      </section>
      <section class="group">
        <h2 class="mono">• Bối cảnh</h2>
        <div class="grid">${locs.map(locCard).join('') || '<div class="card note-box">Chưa có bối cảnh.</div>'}</div>
      </section>`;
  }

  async function makePortraits(which) {
    busy.add(which); notice = null; draw();
    try {
      const body = { project_id: project.id };
      if (which !== 'all') body.character_slug = which;
      const res = await fetch('api/storyforge-portraits', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const text = await res.text();
      let d; try { d = JSON.parse(text); } catch { d = null; }
      if (!res.ok || !d) throw new Error(`workflow báo lỗi (${res.status}), xem tab Executions trong n8n`);
      notice = { ok: true, text: `Đã tạo chân dung cho ${d.count} nhân vật. Các shot tạo sau sẽ dùng chân dung này làm ảnh tham chiếu.` };
    } catch (err) {
      notice = { ok: false, text: `Không tạo được chân dung: ${err.message}.` };
    }
    busy.delete(which);
    try { chars = await loadChars(); } catch { /* giữ dữ liệu cũ */ }
    draw();
  }

  async function uploadPortrait(slug, file) {
    const key = 'up-' + slug;
    busy.add(key); notice = null; draw();
    try {
      const res = await fetch('api/portrait', {
        method: 'POST', headers: { 'X-Project': project.id, 'X-Char': slug, 'Content-Type': 'application/octet-stream' }, body: file,
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `lỗi ${res.status}`);
      notice = { ok: true, text: 'Đã thay chân dung. Các shot tạo sau sẽ dùng ảnh này làm ảnh tham chiếu.' };
    } catch (err) {
      notice = { ok: false, text: `Không tải được ảnh: ${err.message}.` };
    }
    busy.delete(key);
    try { chars = await loadChars(); } catch { /* giữ dữ liệu cũ */ }
    draw();
  }

  root.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-portrait]');
    if (b && !b.disabled && !busy.size) makePortraits(b.dataset.portrait);
  });
  async function uploadProp(slug, item, file) {
    const key = `pr-${slug}-${item - 1}`;
    busy.add(key); notice = null; draw();
    try {
      const res = await fetch('api/prop', {
        method: 'POST', headers: { 'X-Project': project.id, 'X-Char': slug, 'X-Item': String(item), 'Content-Type': 'application/octet-stream' }, body: file,
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `lỗi ${res.status}`);
      notice = { ok: true, text: 'Đã lưu ảnh phụ kiện. Trang Gói shot sẽ nhắc đính kèm ảnh này ở các shot có nhân vật đó.' };
    } catch (err) {
      notice = { ok: false, text: `Không tải được ảnh phụ kiện: ${err.message}.` };
    }
    busy.delete(key);
    try { chars = await loadChars(); } catch { /* giữ dữ liệu cũ */ }
    draw();
  }

  root.addEventListener('change', (ev) => {
    const input = ev.target.closest('[data-upload]');
    if (input && input.files[0] && !busy.size) return uploadPortrait(input.dataset.upload, input.files[0]);
    const prop = ev.target.closest('[data-prop]');
    if (prop && prop.files[0] && !busy.size) {
      const [slug, item] = prop.dataset.prop.split('|');
      uploadProp(slug, Number(item), prop.files[0]);
    }
  });
  draw();
});
</script>
</body>
</html>
