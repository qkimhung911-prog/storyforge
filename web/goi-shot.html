<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gói shot | StoryForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23111'/%3E%3Cpath d='M9.5 7.5v9l7-4.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
  .pack { display: flex; flex-direction: column; gap: 16px; }
  .shot { padding: 20px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; }
  .shot h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.5px; font-weight: 600; }
  .shot p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .shot textarea { width: 100%; min-height: 170px; box-sizing: border-box; font: 400 12px/1.5 var(--mono); padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #FBF8F4; color: var(--text); resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .side video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 16/9; }
  .slot { aspect-ratio: 16/9; border: 1px dashed var(--line); border-radius: 12px; display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 12px; }
  .ok { color: var(--green); font-weight: 600; }
  .bad { color: #B3261E; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -1px; margin-right: 8px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .howto { padding: 18px 20px; font-size: 14px; line-height: 1.6; }
  .howto ol { margin: 8px 0 0; padding-left: 20px; }
  .assemble { padding: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  @media (max-width: 900px) { .shot { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <header class="hero app-hero" id="hero"></header>
  <main class="content" id="content" aria-live="polite"><div class="card note-box">Đang tải…</div></main>
  <footer class="mono" style="font-size:11px;text-align:center;padding:36px 0 40px;color:var(--muted)">StoryForge · dự án portfolio</footer>
</div>
<script src="config.js"></script>
<script src="app.js?v=5"></script>
<script>
SF.boot({
  active: 'tien-trinh', step: 4, pageTitle: 'Gói shot',
  title: 'Gói shot cho <span class="grad-text">Google Flow</span>',
  sub: 'Mỗi shot có sẵn lời nhắc. Sao chép vào Flow, tạo clip, tải clip về rồi thả vào đây. StoryForge ghép thành phim.',
}, async (project, root) => {
  const e = SF.esc;
  const pid = project.id;
  let data = null;
  const state = {};   // slug -> { busy, msg, isErr }
  let assembling = false, assembleMsg = '';

  async function clipExists(slug) {
    try { const r = await fetch(`output/${pid}/clips/${slug}.mp4`, { method: 'HEAD', cache: 'no-store' }); return r.ok; } catch { return false; }
  }

  async function load() {
    const [shots, scenes, chars, proj] = await Promise.all([
      SF.query(`shots?project_id=eq.${pid}&select=slug,scene_id,shot_order,action,camera,duration_sec,dialogue,characters,keyframe_prompt,version`),
      SF.query(`scenes?project_id=eq.${pid}&select=id,number&order=number`),
      SF.query(`characters?project_id=eq.${pid}&select=slug,name`),
      SF.query(`projects?id=eq.${pid}&select=video_path`),
    ]);
    const no = Object.fromEntries(scenes.map((s) => [s.id, s.number]));
    shots.sort((a, b) => (no[a.scene_id] - no[b.scene_id]) || (a.shot_order - b.shot_order));
    const names = Object.fromEntries(chars.map((c) => [c.slug, c.name]));
    await Promise.all(shots.map(async (s) => { s._num = `${no[s.scene_id]}.${s.shot_order}`; s._clip = await clipExists(s.slug); }));
    data = { shots, names, videoPath: (proj[0] || {}).video_path || null };
  }

  // Lời nhắc cho Flow: mô tả hình (do "đạo diễn" viết, đã có màu chung, bối cảnh, nhân vật) + thoại + chỉ dẫn "nói, không hát".
  function promptOf(s) {
    const base = (s.keyframe_prompt || s.action || '').trim();
    const lines = (Array.isArray(s.dialogue) ? s.dialogue : []).map((d) => {
      const who = data.names[d.character_id] || d.character_id || 'The character';
      return `${who} says one short sentence in Vietnamese in a plain, flat, everyday conversational voice, like casual talk (speaking, NOT singing, no melody, normal speed): "${d.line}" Accurate lip sync, natural subtle expression.`;
    });
    const sound = lines.length ? 'Soft natural ambient sound only, absolutely no music.' : 'Soft natural ambient sound only, no dialogue, no music.';
    return ['Photorealistic cinematic shot, shot on 35mm film, real people, natural skin texture, no beauty filter.', base, ...lines, sound, 'No subtitles, no text on screen.'].join('\n');
  }

  function draw() {
    const have = data.shots.filter((s) => s._clip).length;
    const cards = data.shots.map((s) => {
      const st = state[s.slug] || {};
      const dialogue = (Array.isArray(s.dialogue) ? s.dialogue : []).map((d) => `${e(data.names[d.character_id] || d.character_id)}: “${e(d.line)}”`).join('<br>');
      return `
      <article class="card shot" data-slug="${e(s.slug)}">
        <div>
          <h3>Shot ${e(s._num)} <span class="mono" style="font-size:12px;color:var(--muted)">${e(s.camera || '')}</span></h3>
          <p>${e(s.action)}${dialogue ? `<br><b>Thoại:</b><br>${dialogue}` : ''}</p>
          <textarea readonly aria-label="Lời nhắc shot ${e(s._num)}">${e(promptOf(s))}</textarea>
          <div class="row"><button class="btn" type="button" data-copy="${e(s.slug)}">Sao chép lời nhắc</button><span class="muted" data-copied="${e(s.slug)}"></span></div>
        </div>
        <div class="side">
          ${s._clip ? `<video controls preload="metadata" src="output/${e(pid)}/clips/${e(s.slug)}.mp4?v=${e(st.stamp || 0)}"></video>` : '<div class="slot">Chưa có clip.<br>Thả file MP4 vào nút bên dưới.</div>'}
          <label class="btn btn-dark no-arrow ${st.busy ? 'busy' : ''}" style="cursor:pointer;text-align:center">
            ${st.busy ? '<span class="spin" aria-hidden="true"></span>Đang xử lý…' : (s._clip ? 'Thay clip khác' : 'Tải clip lên')}
            <input type="file" accept="video/mp4,video/quicktime,video/*" data-up="${e(s.slug)}" hidden ${st.busy ? 'disabled' : ''}>
          </label>
          <span class="${st.isErr ? 'bad' : 'ok'}">${e(st.msg || '')}</span>
        </div>
      </article>`;
    }).join('');
    root.innerHTML = `
      <div class="summary">
        <span class="chip">Dự án: <b>${e(project.title)}</b></span>
        <span class="chip">${have} / ${data.shots.length} shot đã có clip</span>
      </div>
      <section class="card howto">
        <b>Cách làm (mỗi shot):</b>
        <ol>
          <li>Mở <a href="https://flow.google" target="_blank" rel="noopener" style="color:var(--pink)">Google Flow</a>, chọn Veo 3.1, tạo video từ chữ. Dùng mục Characters của Flow để giữ cùng một khuôn mặt giữa các shot.</li>
          <li>Bấm “Sao chép lời nhắc” ở shot, dán vào Flow, tạo clip (khoảng 8 giây là đủ).</li>
          <li>Tải clip về máy, rồi bấm “Tải clip lên” ở đúng shot đó. Clip có tiếng thì giữ nguyên tiếng, StoryForge không chèn giọng đọc khác.</li>
          <li>Đủ clip thì bấm “Ghép thành phim” ở cuối trang. Shot nào chưa có clip sẽ dùng ảnh tĩnh như trước.</li>
        </ol>
      </section>
      <div class="pack" style="margin-top:16px">${cards || '<div class="card note-box">Chưa có shot nào.</div>'}</div>
      <section class="card assemble" style="margin-top:16px">
        <div><b>Ghép thành phim</b><br><span class="muted">${have} clip thật, ${data.shots.length - have} shot dùng ảnh tĩnh.</span><br><span class="${assembleMsg.startsWith('Lỗi') ? 'bad' : 'ok'}">${e(assembleMsg)}</span></div>
        <div class="row">
          <button class="btn btn-dark no-arrow" type="button" id="assemble" ${assembling ? 'disabled' : ''}>${assembling ? '<span class="spin" aria-hidden="true"></span>Đang ghép…' : 'Ghép thành phim'}</button>
          ${data.videoPath ? `<a class="btn" href="timeline.html${location.search}">Xem Timeline →</a>` : ''}
        </div>
      </section>`;
  }

  async function upload(slug, file) {
    state[slug] = { busy: true }; draw();
    try {
      const res = await fetch('api/clip', { method: 'POST', headers: { 'X-Project': pid, 'X-Shot': slug, 'Content-Type': 'application/octet-stream' }, body: file });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || `lỗi ${res.status}`);
      state[slug] = { msg: `Đã nhận ${d.duration}s ${d.has_audio ? 'có tiếng' : 'KHÔNG có tiếng (sẽ chèn giọng TTS nếu có)'}.`, stamp: Date.now() };
      const shot = data.shots.find((s) => s.slug === slug); if (shot) shot._clip = true;
    } catch (err) {
      state[slug] = { msg: `Lỗi: ${err.message}`, isErr: true };
    }
    draw();
  }

  async function assemble() {
    assembling = true; assembleMsg = ''; draw();
    try {
      const res = await fetch('api/storyforge-render', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project_id: pid }) });
      const d = await res.json().catch(() => null);
      if (!res.ok || !d) throw new Error(`workflow báo lỗi (${res.status}), xem tab Executions trong n8n`);
      assembleMsg = `Xong: ${d.shots} shot${d.size_bytes ? ', ' + Math.round(d.size_bytes / 1024) + ' KB' : ''}.`;
      await load();
    } catch (err) { assembleMsg = `Lỗi: ${err.message}`; }
    assembling = false; draw();
  }

  root.addEventListener('click', async (ev) => {
    const c = ev.target.closest('[data-copy]');
    if (c) {
      const s = data.shots.find((x) => x.slug === c.dataset.copy);
      const tag = root.querySelector(`[data-copied="${c.dataset.copy}"]`);
      try { await navigator.clipboard.writeText(promptOf(s)); tag.textContent = 'Đã sao chép.'; }
      catch { tag.textContent = 'Không sao chép được, hãy chọn chữ trong khung rồi Cmd+C.'; }
      return;
    }
    if (ev.target.closest('#assemble') && !assembling) assemble();
  });
  root.addEventListener('change', (ev) => {
    const input = ev.target.closest('[data-up]');
    if (input && input.files[0]) upload(input.dataset.up, input.files[0]);
  });

  await load();
  draw();
});
</script>
</body>
</html>
