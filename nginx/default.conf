server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Video và file thoại do container render xuất ra
  location /output/ {
    alias /srv/output/;
    add_header Cache-Control "no-cache";
  }

  # Kịch bản mẫu cho nút "Dùng kịch bản mẫu" (chỉ phục vụ đúng một file)
  location = /demo-script.md {
    alias /srv/docs/demo-script.md;
    default_type "text/plain; charset=utf-8";
  }

  # Cổng chuyển tiếp tới webhook n8n (đã Publish). Chỉ liệt kê đúng 4 địa chỉ, không mở cả n8n.
  # Gemini có thể chậm (thử lại tối đa 3 lần x 120 giây) nên cho chờ lâu.
  location = /api/storyforge-parse {
    proxy_pass http://n8n:5678/webhook/storyforge-parse;
    proxy_read_timeout 420s;
    client_max_body_size 1m;
  }
  location = /api/storyforge-keyframes {
    proxy_pass http://n8n:5678/webhook/storyforge-keyframes;
    proxy_read_timeout 300s;
  }
  location = /api/storyforge-tts {
    proxy_pass http://n8n:5678/webhook/storyforge-tts;
    proxy_read_timeout 420s;
  }
  location = /api/storyforge-render {
    proxy_pass http://n8n:5678/webhook/storyforge-render;
    proxy_read_timeout 300s;
  }

  # Luôn hỏi lại máy chủ, để sửa file là thấy ngay (không bị kẹt bản cũ trong trình duyệt)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
